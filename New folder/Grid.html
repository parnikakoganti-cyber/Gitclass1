<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="header">
        <h1>Header Element</h1>

    <nav class="nav">
        <span>Home</span>
        <span>About</span>
        <span>Login</span>
    </nav>    
    </div>
    <div class"container">
        <div class="main-box">Main Box</div>
        <div class="side-box">Side Box</div>
    </div>
    <footer>Footer</footer>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .header{
            height: 100px;
            background-color: rgb(255, 0, 0);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav{
            display: flex;
            gap: 20px;
            margin-right: 20px;
        }

        .container{
            display: flex;
        }

        .main-box {
            background-color: rgb(202, 218, 33);
            flex: 3;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .side-box {
            background-color: rgb(40, 255, 40);
            color: white;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;

        }

        footer {
            height: 80px;
            background-color: rgba(0, 0, 255, 0.731);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;

        }
    </style>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webpage Layout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 100px;
            background-color: red;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
        }

        .small-boxes {
            display: flex;
        }

        .small-box {
            background-color: rgb(56, 232, 255);
            height: 100px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            display: flex;
            flex: 1;
        }

        .main-box {
            background-color: rgb(202, 218, 33);
            flex: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: bold;
        }

        .side-box {
            background-color: rgb(40, 255, 40);
            color: white;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: bold;
        }

        footer {
            height: 80px;
            background-color: rgba(0, 0, 255, 0.731);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>HEADER</header>

    <div class="small-boxes">
        <div class="small-box">SMALLBOX 1</div>
        <div class="small-box">SMALL BOX 2</div>
        <div class="small-box">SMALL BOX 3</div>
    </div>

    <div class="container">
        <div class="main-box">MAIN BOX</div>
        <div class="side-box">SIDE BOX</div>
    </div>

    <footer>FOOTER</footer>

</body>
</html>
